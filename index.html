<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sayatech Industries — Under Maintenance</title>
  <meta name="description" content="Sayatech Industries is temporarily down for maintenance. We'll be back soon.">
  <meta name="theme-color" content="#061510">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #061510;
      color: #eef5f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
    }
    .container { max-width: 560px; }
    .logo {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 1.5rem;
    }
    .logo span { color: #d4af37; }
    .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      margin-bottom: 1rem;
    }
    h1 em { color: #d4af37; font-style: normal; }
    p {
      color: #a8c0b3;
      line-height: 1.7;
      margin-bottom: 2rem;
      font-size: 1.05rem;
    }
    .contact {
      display: inline-block;
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 999px;
      padding: 0.8rem 1.6rem;
      color: #e8cf7a;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.25s;
    }
    .contact:hover { background: rgba(212, 175, 55, 0.22); }
    footer {
      margin-top: 3rem;
      font-size: 0.85rem;
      color: #a8c0b3;
    }
  </style>
<base target="_blank">
</head>
<body>
  <div class="container">
    <div class="logo">Sayatech <span>Industries</span></div>
    <div class="icon">🛠️</div>
    <h1>We're down for <em>maintenance</em></h1>
    <p>We're working hard to bring you a brand-new experience.<br>We'll be back online shortly — thank you for your patience.</p>
    <a class="contact" href="https://wa.me/2349016651148">Contact us on WhatsApp</a>
    <footer>© 2026 Sayatech Industries</footer>
  </div>
</body>
</html>
